<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart | Harbor &amp; Pine</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="sticky-top">
<nav class="navbar navbar-expand flex-wrap navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Harbor &amp; Pine</a>
    <div class="navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Shop</a></li>
        <li id="auth-links"></li>

      </ul>
      <a class="btn btn-outline-light position-relative" href="cart.html">
        Cart
        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </a>
    </div>
  </div>
</nav>
</header>

<main class="container py-5">
  <h1 class="h3 fw-bold mb-4">Your Cart</h1>

  <div id="loading" class="text-center py-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <div id="empty-msg" class="text-center py-5" style="display:none">
    <p class="text-muted fs-5">Your cart is empty.</p>
    <a href="products.html" class="btn btn-dark">Continue Shopping</a>
  </div>

  <div id="cart-content" style="display:none">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-0">
            <table class="table mb-0" id="cart-table">
              <thead class="table-light">
                <tr>
                  <th>Product</th>
                  <th class="text-center">Qty</th>
                  <th class="text-end">Price</th>
                  <th class="text-end">Subtotal</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="cart-rows"></tbody>
            </table>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-outline-danger btn-sm" onclick="clearCart()">Clear Cart</button>
        </div>



      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Order Summary</h2>
            <dl class="row mb-1">
              <dt class="col-7">Subtotal</dt><dd class="col-5 text-end" id="subtotal">$0.00</dd>
              <dt class="col-7">Shipping</dt><dd class="col-5 text-end" id="shipping">—</dd>
            </dl>
            <hr>
            <dl class="row mb-3">
              <dt class="col-7 fs-5">Total</dt><dd class="col-5 text-end fs-5 fw-bold" id="total">$0.00</dd>
            </dl>
            <a href="checkout.html" class="btn btn-dark w-100">Proceed to Checkout</a>
            <a href="products.html" class="btn btn-link w-100 text-muted">Continue Shopping</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-light mt-5">
  <div class="container py-4">
    <p class="small text-secondary mb-0">&copy; 2026 Harbor &amp; Pine Home Goods LLC.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'https://fakestoreapi.com';

function updateCartBadge() {
  const cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.qty, 0);
}

function clearCart() {
  localStorage.removeItem('hp_cart');
  location.reload();
}

function removeItem(id) {
  let cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  cart = cart.filter(i => i.id !== id);
  localStorage.setItem('hp_cart', JSON.stringify(cart));
  location.reload();
}

function updateQty(id, qty) {
  let cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  const item = cart.find(i => i.id === id);
  if (item) { if (qty < 1) { removeItem(id); return; } item.qty = qty; }
  localStorage.setItem('hp_cart', JSON.stringify(cart));
  location.reload();
}

async function loadCart() {
  const cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  document.getElementById('loading').style.display = 'none';

  if (!cart.length) {
    document.getElementById('empty-msg').style.display = 'block';
    return;
  }

  document.getElementById('cart-content').style.display = 'block';

  let subtotal = 0;

  const rows = await Promise.all(cart.map(async item => {
    const endpoint = `${API}/products/${item.id}`;
    const res = await fetch(endpoint);
    const p = await res.json();
    const sub = p.price * item.qty;
    subtotal += sub;
    return `
      <tr>
        <td>
          <div class="d-flex align-items-center gap-3">
            <img src="${p.image}" style="width:52px;height:52px;object-fit:contain;" alt="${p.title}">
            <a href="product.html?id=${p.id}" class="text-decoration-none text-dark small">${p.title}</a>
          </div>
        </td>
        <td class="text-center">
          <input type="number" class="form-control form-control-sm text-center mx-auto" style="width:65px"
            value="${item.qty}" min="1" max="10"
            onchange="updateQty(${p.id}, parseInt(this.value))">
        </td>
        <td class="text-end small">$${p.price.toFixed(2)}</td>
        <td class="text-end small fw-semibold">$${sub.toFixed(2)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${p.id})">&times;</button>
        </td>
      </tr>
    `;
  }));

  document.getElementById('cart-rows').innerHTML = rows.join('');

  const shipping = subtotal >= 75 ? 0 : 7.99;
  document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
  document.getElementById('shipping').textContent = shipping === 0 ? 'FREE' : `$${shipping.toFixed(2)}`;
  document.getElementById('total').textContent = `$${(subtotal + shipping).toFixed(2)}`;

  // Also POST to FakeStore cart API
  const cartPayload = { userId: 1, date: new Date().toISOString().split('T')[0], products: cart.map(i => ({ productId: i.id, quantity: i.qty })) };
  await fetch(`${API}/carts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cartPayload) });
}

function updateAuthNav() {
  const el = document.getElementById('auth-links');
  if (!el) return;
  const token = localStorage.getItem('hp_token');
  if (token) {
    el.innerHTML = '<a class="nav-link" href="#" onclick="logout(event)">Log out</a>';
    el.className = 'nav-item';
  } else {
    el.outerHTML = '<li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li><li class="nav-item"><a class="nav-link" href="signup.html">Sign up</a></li>';
  }
}

function logout(e) {
  if (e) e.preventDefault();
  localStorage.removeItem('hp_token');
  window.location.reload();
}

updateCartBadge();
updateAuthNav();
loadCart();
</script>
</body>
</html>
