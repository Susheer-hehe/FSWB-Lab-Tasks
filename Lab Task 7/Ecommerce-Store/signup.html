<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | Harbor &amp; Pine</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="sticky-top">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Harbor &amp; Pine</a>
  </div>
</nav>
</header>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-1">Create an account</h1>
          <p class="text-muted small mb-4">Join Harbor &amp; Pine for faster checkout and order tracking.</p>
          <div id="alert" class="alert" style="display:none"></div>
          <form id="signup-form">
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label">First Name</label>
                <input class="form-control" id="firstname" required>
              </div>
              <div class="col-6">
                <label class="form-label">Last Name</label>
                <input class="form-control" id="lastname" required>
              </div>
              <div class="col-12">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" id="email" required>
              </div>
              <div class="col-12">
                <label class="form-label">Username</label>
                <input class="form-control" id="reg-username" required>
              </div>
              <div class="col-12">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" id="reg-password" required minlength="6">
              </div>
              <div class="col-12">
                <label class="form-label">Phone</label>
                <input class="form-control" type="tel" id="phone">
              </div>
            </div>
            <button class="btn btn-dark w-100 mt-4" type="submit" id="signup-btn">Create Account</button>
          </form>
          <hr>
          <p class="text-center small mb-0">Already have an account? <a href="login.html">Log in</a></p>
        </div>
      </div>


    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'https://fakestoreapi.com';
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signup-btn');
  const alertEl = document.getElementById('alert');
  btn.disabled = true; btn.textContent = 'Creating account...';
  alertEl.style.display = 'none';
  const payload = {
    email: document.getElementById('email').value,
    username: document.getElementById('reg-username').value,
    password: document.getElementById('reg-password').value,
    name: { firstname: document.getElementById('firstname').value, lastname: document.getElementById('lastname').value },
    address: { city: 'Portland', street: 'Alder St', number: 412, zipcode: '97204', geolocation: { lat: '45.52', long: '-122.67' } },
    phone: document.getElementById('phone').value || '000-000-0000'
  };
  try {
    const res = await fetch(`${API}/users`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    alertEl.className = 'alert alert-success';
    alertEl.textContent = `Account created! Your user ID is ${data.id}. Redirecting to login...`;
    alertEl.style.display = 'block';
    setTimeout(() => window.location.href = 'login.html', 2000);
  } catch {
    alertEl.className = 'alert alert-danger';
    alertEl.textContent = 'Signup failed. Please try again.';
    alertEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
