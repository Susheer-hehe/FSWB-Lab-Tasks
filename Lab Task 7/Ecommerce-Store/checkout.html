<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Harbor &amp; Pine</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="sticky-top">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Harbor &amp; Pine</a>
    <span class="text-light small">Secure Checkout</span>
  </div>
</nav>
</header>
<main class="container py-5">
  <h1 class="h3 fw-bold mb-4">Checkout</h1>
  <div class="row g-5">
    <div class="col-lg-7">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Shipping Information</h2>
          <form id="checkout-form">
            <div class="row g-3">
              <div class="col-6"><label class="form-label">First Name</label><input class="form-control" name="firstName" required></div>
              <div class="col-6"><label class="form-label">Last Name</label><input class="form-control" name="lastName" required></div>
              <div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
              <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" required></div>
              <div class="col-6"><label class="form-label">City</label><input class="form-control" name="city" required></div>
              <div class="col-3"><label class="form-label">State</label><input class="form-control" name="state" required></div>
              <div class="col-3"><label class="form-label">ZIP</label><input class="form-control" name="zip" required></div>
            </div>
            <hr class="my-4">
            <h2 class="h5 mb-3">Payment</h2>
            <div class="row g-3">
              <div class="col-12"><label class="form-label">Card Number</label><input class="form-control" placeholder="1234 5678 9012 3456" required></div>
              <div class="col-6"><label class="form-label">Expiry</label><input class="form-control" placeholder="MM/YY" required></div>
              <div class="col-6"><label class="form-label">CVV</label><input class="form-control" placeholder="123" required></div>
            </div>
            <button class="btn btn-dark btn-lg w-100 mt-4" type="submit" id="place-btn">Place Order</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Order Summary</h2>
          <div id="order-loading" class="text-center"><div class="spinner-border spinner-border-sm"></div></div>
          <ul class="list-group list-group-flush" id="order-items"></ul>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total</span><span id="order-total">$0.00</span>
          </div>
        </div>
      </div>


    </div>
  </div>
</main>
<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body text-center py-5">
        <div class="display-1 mb-3">&#10003;</div>
        <h2 class="h4 fw-bold">Order Placed!</h2>
        <p class="text-muted" id="order-id-msg"></p>
        <a href="index.html" class="btn btn-dark">Back to Home</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'https://fakestoreapi.com';
async function loadSummary() {
  const cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  const items = document.getElementById('order-items');
  document.getElementById('order-loading').style.display = 'none';
  if (!cart.length) { items.innerHTML = '<li class="list-group-item text-muted">Cart is empty.</li>'; return; }
  let total = 0;
  for (const item of cart) {
    const res = await fetch(`${API}/products/${item.id}`);
    const p = await res.json();
    const sub = p.price * item.qty;
    total += sub;
    items.innerHTML += `<li class="list-group-item d-flex justify-content-between"><span class="small">${p.title} x${item.qty}</span><span class="small fw-semibold">$${sub.toFixed(2)}</span></li>`;
  }
  document.getElementById('order-total').textContent = `$${total.toFixed(2)}`;
}
document.getElementById('checkout-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('place-btn');
  btn.disabled = true; btn.textContent = 'Placing order...';
  const cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  const payload = { userId: 1, date: new Date().toISOString().split('T')[0], products: cart.map(i => ({ productId: i.id, quantity: i.qty })) };
  const res = await fetch(`${API}/carts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await res.json();
  localStorage.removeItem('hp_cart');
  document.getElementById('order-id-msg').textContent = `Your order ID is #${data.id}. Thank you for shopping with Harbor & Pine!`;
  new bootstrap.Modal(document.getElementById('successModal')).show();
});
loadSummary();
</script>
</body>
</html>
