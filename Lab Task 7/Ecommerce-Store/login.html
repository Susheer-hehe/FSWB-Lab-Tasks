<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In | Harbor &amp; Pine</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="sticky-top">
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Harbor &amp; Pine</a>
  </div>
</nav>
</header>
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-1">Log in</h1>
          <p class="text-muted small mb-4">Welcome back to Harbor &amp; Pine.</p>
          <div id="alert" class="alert" style="display:none"></div>
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" id="username" required placeholder="e.g. johnd">
              <div class="form-text">Try: <code>johnd</code></div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" required placeholder="e.g. m38rmF$">
              <div class="form-text">Try: <code>m38rmF$</code></div>
            </div>
            <button class="btn btn-dark w-100" type="submit" id="login-btn">Log in</button>
          </form>
          <hr>
          <p class="text-center small mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
      </div>


    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'https://fakestoreapi.com';
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const alert = document.getElementById('alert');
  btn.disabled = true; btn.textContent = 'Logging in...';
  alert.style.display = 'none';
  const payload = { username: document.getElementById('username').value, password: document.getElementById('password').value };
  try {
    const res = await fetch(`${API}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('hp_token', data.token);
      alert.className = 'alert alert-success'; alert.textContent = 'Login successful! Redirecting...';
      alert.style.display = 'block';
      setTimeout(() => window.location.href = 'products.html', 1500);
    } else {
      throw new Error('Invalid credentials');
    }
  } catch {
    alert.className = 'alert alert-danger'; alert.textContent = 'Login failed. Check your username and password.';
    alert.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
