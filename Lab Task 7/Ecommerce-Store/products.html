<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Harbor &amp; Pine</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="sticky-top">
<nav class="navbar navbar-expand flex-wrap navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Harbor &amp; Pine</a>
    <div class="navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="products.html">Shop</a></li>
        <li id="auth-links"></li>

      </ul>
      <input class="form-control me-2 w-auto" type="search" id="search-input" placeholder="Search products">
      <a class="btn btn-outline-light position-relative" href="cart.html">
        Cart
        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </a>
    </div>
  </div>
</nav>
</header>

<main class="container py-5">
  <div class="row g-4">
    <!-- Sidebar filters -->
    <div class="col-lg-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h6 mb-3">Categories</h2>
          <div id="category-list">
            <div class="spinner-border spinner-border-sm" role="status"></div>
          </div>
        </div>
      </div>
      <div class="card shadow-sm mt-3">
        <div class="card-body">
          <h2 class="h6 mb-3">Sort by Price</h2>
          <select class="form-select" id="sort-select">
            <option value="default">Featured</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
      </div>
    </div>
    <!-- Product grid -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">All Products</h1>
        <span class="text-muted small" id="result-count">Loading...</span>
      </div>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-4" id="product-grid">
        <div class="col text-center py-5"><div class="spinner-border" role="status"></div></div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-light mt-5">
  <div class="container py-4">
    <p class="small text-secondary mb-0">&copy; 2026 Harbor &amp; Pine Home Goods LLC.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = 'https://fakestoreapi.com';
let allProducts = [];
let activeCategory = 'all';

function updateCartBadge() {
  const cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  document.getElementById('cart-count').textContent = cart.reduce((s, i) => s + i.qty, 0);
}

function stars(r) {
  const full = Math.round(r);
  return '&#9733;'.repeat(full) + '&#9734;'.repeat(5 - full);
}

function addToCart(id) {
  let cart = JSON.parse(localStorage.getItem('hp_cart') || '[]');
  const item = cart.find(i => i.id === id);
  if (item) item.qty++; else cart.push({ id, qty: 1 });
  localStorage.setItem('hp_cart', JSON.stringify(cart));
  updateCartBadge();
  alert('Added to cart!');
}

function renderProducts(products) {
  const grid = document.getElementById('product-grid');
  document.getElementById('result-count').textContent = `${products.length} products`;
  if (!products.length) { grid.innerHTML = '<p class="text-muted">No products found.</p>'; return; }
  grid.innerHTML = products.map(p => `
    <div class="col">
      <article class="card h-100 shadow-sm">
        <img src="${p.image}" class="card-img-top p-3" style="height:180px;object-fit:contain;" alt="${p.title}">
        <div class="card-body">
          <span class="badge bg-secondary mb-1">${p.category}</span>
          <h3 class="h6 card-title"><a class="text-decoration-none text-reset" href="product.html?id=${p.id}">${p.title}</a></h3>
          <p class="mb-1 text-warning small">${stars(p.rating.rate)} <span class="text-muted">(${p.rating.count})</span></p>
          <p class="fw-bold fs-5 mb-0">$${p.price.toFixed(2)}</p>
        </div>
        <div class="card-footer bg-white border-0 pb-3">
          <button class="btn btn-dark w-100" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      </article>
    </div>
  `).join('');
}

function applyFilters() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;
  let filtered = activeCategory === 'all' ? [...allProducts] : allProducts.filter(p => p.category === activeCategory);
  if (query) filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
  if (sort === 'asc') filtered.sort((a, b) => a.price - b.price);
  else if (sort === 'desc') filtered.sort((a, b) => b.price - a.price);
  else if (sort === 'rating') filtered.sort((a, b) => b.rating.rate - a.rating.rate);
  renderProducts(filtered);
}

async function loadCategories() {
  const res = await fetch(`${API}/products/categories`);
  const cats = await res.json();
  const list = document.getElementById('category-list');
  list.innerHTML = `
    <div class="form-check mb-1">
      <input class="form-check-input" type="radio" name="cat" id="cat-all" value="all" checked>
      <label class="form-check-label" for="cat-all">All</label>
    </div>
    ${cats.map(c => `
      <div class="form-check mb-1">
        <input class="form-check-input" type="radio" name="cat" id="cat-${c}" value="${c}">
        <label class="form-check-label text-capitalize" for="cat-${c}">${c}</label>
      </div>
    `).join('')}
  `;
  list.querySelectorAll('input[name="cat"]').forEach(input => {
    input.addEventListener('change', () => { activeCategory = input.value; applyFilters(); });
  });
}

async function loadProducts() {
  const res = await fetch(`${API}/products`);
  allProducts = await res.json();
  applyFilters();
}

document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('sort-select').addEventListener('change', applyFilters);

function updateAuthNav() {
  const el = document.getElementById('auth-links');
  if (!el) return;
  const token = localStorage.getItem('hp_token');
  if (token) {
    el.innerHTML = '<a class="nav-link" href="#" onclick="logout(event)">Log out</a>';
    el.className = 'nav-item';
  } else {
    el.outerHTML = '<li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li><li class="nav-item"><a class="nav-link" href="signup.html">Sign up</a></li>';
  }
}

function logout(e) {
  if (e) e.preventDefault();
  localStorage.removeItem('hp_token');
  window.location.reload();
}

updateCartBadge();
updateAuthNav();
loadCategories();
loadProducts();
</script>
</body>
</html>
